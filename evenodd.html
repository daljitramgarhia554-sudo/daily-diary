<!DOCTYPE html>
<html>
<head>
<title>Even and Odd Numbers</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script>
function printNumbers() {

    let result = "";

    for(let i = 1; i <= 20; i++) {

        if(i % 2 == 0) {
            result += i + " is Even Number <br>";
        } 
        else {
            result += i + " is Odd Number <br>";
        }

    }

    document.getElementById("output").innerHTML = result;
}
</script>

</head>

<body class="bg-info-subtle text-center">

<div class="container mt-5">

<h2 class="text-primary mb-4">Even and Odd Numbers</h2>

<button class="btn btn-danger px-4 py-2" onclick="printNumbers()">
Show Numbers
</button>

<div id="output" class="card mt-4 mx-auto p-3 border-primary" style="max-width:300px;">
</div>

</div>

</body>
</html>
